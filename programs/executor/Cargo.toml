[package]
name = "lorenz-executor"
version = "0.1.0"
edition = "2021"
description = "On-chain atomic arbitrage executor with on-chain profit and spend-cap invariants."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "lorenz_executor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
