[package]
name = "lorenz-executor"
version = "0.1.0"
edition = "2021"
description = "On-chain atomic arbitrage executor with on-chain profit and spend-cap invariants."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "lorenz_executor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[lints.rust]
# Anchor's `#[derive(Accounts)]` expands to `#[cfg(feature = "anchor-debug")]`,
# a feature we deliberately do not expose. Declare it as an expected cfg so the
# crate builds clean under CI's global `-D warnings` (this macro output is
# outside our control).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug"))'] }
