[package]
name = "lorenz-executor"
version = "0.1.0"
edition = "2021"
description = "On-chain atomic arbitrage executor with on-chain profit and spend-cap invariants."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "lorenz_executor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.1"
anchor-spl = "0.30.1"

[lints.rust]
# Anchor's `#[program]` / `#[derive(Accounts)]` macros expand to cfgs that come
# from `solana_program` and are only meaningful on the Solana BPF target —
# `target_os = "solana"`, `feature = "custom-heap"`, `feature = "custom-panic"`,
# `feature = "anchor-debug"`. On the host-side build/test these read as
# "unexpected", and `-D warnings` turns them into errors. This is framework
# macro output we do not control, so we disable the lint for this crate only;
# the rest of the workspace keeps `-D warnings` fully strict.
unexpected_cfgs = "allow"
