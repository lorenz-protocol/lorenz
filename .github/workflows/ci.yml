name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  workspace:
    name: Off-chain workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Backtest smoke run
        run: cargo run -p lorenz-backtest

  onchain:
    name: On-chain program (build + pure-logic tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/executor/target
          key: ${{ runner.os }}-onchain-${{ hashFiles('programs/executor/Cargo.toml') }}

      # Host-side check + unit tests of the pure arithmetic/guards. The Anchor
      # `Accounts` derive emits benign `anchor-debug` cfg warnings outside our
      # control, so we do not treat warnings as errors for this crate. A full
      # `anchor build` / localnet test run requires the Solana toolchain and is
      # run separately.
      - name: Build + test on-chain program
        working-directory: programs/executor
        run: cargo test --lib
