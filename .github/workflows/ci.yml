name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  workspace:
    name: Off-chain workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Backtest smoke run
        run: cargo run -p lorenz-backtest

  onchain:
    name: On-chain program (build + pure-logic tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/executor/target
          key: ${{ runner.os }}-onchain-${{ hashFiles('programs/executor/Cargo.toml') }}

      # Host-side check + unit tests of the pure arithmetic/guards. Anchor's
      # `#[program]`/`Accounts` macros emit Solana-target-only cfgs that are
      # "unexpected" on the host; we silence the `unexpected_cfgs` lint for this
      # crate in programs/executor/Cargo.toml (`[lints.rust]`) so it builds clean
      # under the global `-D warnings`. A full `anchor build` / localnet test run
      # requires the Solana toolchain and is run separately.
      - name: Build + test on-chain program
        working-directory: programs/executor
        run: cargo test --lib

  # Advisory-only supply-chain scan against the RustSec advisory database.
  # This job is intentionally NON-GATING: `continue-on-error: true` means a
  # newly-published advisory surfaces as a warning without blocking merges or
  # releases. It needs no repo config (unlike cargo-deny), so it stays
  # self-contained here.
  audit:
    name: Supply-chain audit (advisories)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
