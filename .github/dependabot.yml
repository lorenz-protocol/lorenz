version: 2
updates:
  # Host workspace crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # On-chain program (excluded from the host workspace, separate lockfile)
  - package-ecosystem: "cargo"
    directory: "/programs/executor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "on-chain"]

  # CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
